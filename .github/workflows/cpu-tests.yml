name: CPU adapter tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-light.txt
      - run: python -m pytest tests -q
      - run: python -m compileall -q agar local_app.py agar_cli.py scripts/infworld_inference.py
